<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Single Page Application fallback for GitHub Pages
    (function() {
      var repoName = 'fahis-doctor-portal';
      var basename = '/' + repoName;
      
      // Get the route path (without repo name and without index.html)
      var fullPath = window.location.pathname;
      var routePath = fullPath;
      
      // Remove the repo name from the beginning of the path
      if (routePath.indexOf(basename) === 0) {
        routePath = routePath.substring(basename.length);
      }
      
      // If routePath is empty or just a slash, use '/dashboard' as default
      if (!routePath || routePath === '/' || routePath === '/index.html') {
        routePath = '/dashboard';
      }
      
      // Store the route (without basename) for the app to use
      sessionStorage.setItem('redirectPath', routePath);
      console.log('Stored redirectPath:', routePath);
      
      // Redirect to index.html
      window.location.replace('index.html');
    })();
  </script>
</head>
<body>
  <p>Redirecting... check console for debug info</p>
</body>
</html>
