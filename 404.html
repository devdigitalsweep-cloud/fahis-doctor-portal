<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Single Page Application fallback for GitHub Pages
    (function() {
      // Get the repository name from the URL path
      var pathParts = window.location.pathname.split('/');
      var repoName = 'fahis-doctor-portal';
      
      // Remove repo name from path to get the route
      var routePath = window.location.pathname;
      if (routePath.indexOf('/' + repoName) === 0) {
        routePath = routePath.substring(repoName.length + 1);
      }
      if (!routePath) routePath = '/';
      routePath += window.location.search;
      
      // Store the original route for the app to restore
      sessionStorage.setItem('redirectPath', routePath);
      
      // Redirect to index.html in the same folder
      window.location.replace('index.html');
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
