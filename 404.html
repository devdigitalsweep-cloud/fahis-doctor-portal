<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Single Page Application fallback for GitHub Pages
    (function() {
      // Get the base path from the current URL
      var basePath = '/fahis-doctor-portal';
      var path = window.location.pathname.replace(basePath, '') || '/';
      var search = window.location.search;
      
      // Store the original path and search params for the app to restore
      sessionStorage.setItem('redirectPath', path + search);
      
      // Redirect to index.html
      window.location.replace(basePath + '/index.html');
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
