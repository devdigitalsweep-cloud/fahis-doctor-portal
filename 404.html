<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <script>
      // GitHub Pages SPA fallback - redirect to index.html with hash routing
      var repoName = '/fahis-doctor-portal-main';
      var currentPath = window.location.pathname;
      
      // Redirect to index.html with the path as a hash
      var targetUrl = repoName + '/index.html';
      
      // If there's a path after the repo name, preserve it as hash
      if (currentPath && currentPath !== repoName && currentPath !== repoName + '/') {
        var pathAfterRepo = currentPath.replace(repoName, '').replace(/^\//, '');
        if (pathAfterRepo && pathAfterRepo !== 'index.html') {
          targetUrl += '#/' + pathAfterRepo;
        }
      }
      
      window.location.replace(targetUrl);
    </script>
  </head>
  <body>
    <p>Loading Fahis Doctor Portal...</p>
  </body>
</html>
