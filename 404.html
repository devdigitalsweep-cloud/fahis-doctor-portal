<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fahis Doctor Portal - Professional Medical Platform</title>
    <script>
      // GitHub Pages SPA fallback - redirect to index.html with current path
      var repoName = '/fahis-doctor-portal-main';
      var currentPath = window.location.pathname;
      var targetPath = repoName + '/index.html';
      
      // If we're not already on the index.html, redirect
      if (currentPath !== repoName + '/' && currentPath !== repoName + '/index.html') {
        targetPath += '#' + currentPath.substring(repoName.length);
      }
      
      window.location.replace(targetPath);
    </script>
  </head>
  <body>
    <p>Redirecting to homepage...</p>
  </body>
</html>
