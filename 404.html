<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <script>
      // GitHub Pages SPA fallback
      var repoName = '/fahis-doctor-portal-main';
      var currentPath = window.location.pathname;
      
      // Check if we need to add the repo name to the path
      if (!currentPath.startsWith(repoName)) {
        // Redirect to the correct URL with repo name
        window.location.replace(repoName + '/index.html#' + currentPath);
      } else {
        // We're at the right base, redirect to index.html
        var pathAfterRepo = currentPath.replace(repoName, '').replace(/^\//, '');
        var targetUrl = repoName + '/index.html';
        
        if (pathAfterRepo && pathAfterRepo !== 'index.html') {
          targetUrl += '#/' + pathAfterRepo;
        }
        
        window.location.replace(targetUrl);
      }
    </script>
  </head>
  <body>
    <p>Loading Fahis Doctor Portal...</p>
  </body>
</html>
